name: yt_section_downloader
description: >-
  The quickest way to extract and download any section of a video from a link.
  By pasting a timestamped URL, or by providing your own custom timestamps,
  downloading and cutting are handled automatically. With built-in job queuing,
  you can queue and clip multiple videos and sections all at once!
homepage: https://drjetski.com
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
