name: Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the pubspec version (for example v0.5.0-beta)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TOOL_SOURCES_URL: ${{ vars.LINUX_TOOL_SOURCES_URL }}
      TOOL_SOURCES_SHA256: ${{ vars.LINUX_TOOL_SOURCES_SHA256 }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Validate release tag
        id: release
        run: python scripts/release_ci.py validate-tag --tag "$RELEASE_TAG"

      - name: Reclaim unused hosted-runner SDK space
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h .

      - name: Fetch matching tool sources
        shell: bash
        run: |
          set -euo pipefail
          : "${TOOL_SOURCES_URL:?Set repository variable LINUX_TOOL_SOURCES_URL}"
          : "${TOOL_SOURCES_SHA256:?Set repository variable LINUX_TOOL_SOURCES_SHA256}"
          python scripts/release_ci.py fetch-sources \
            --platform linux-x64 \
            --url "$TOOL_SOURCES_URL" \
            --sha256 "$TOOL_SOURCES_SHA256" \
            --destination release-sources/linux-x64

      - name: Install Flatpak build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            flatpak flatpak-builder bubblewrap \
            build-essential clang cmake ninja-build pkg-config libgtk-3-dev \
            curl git unzip xz-utils zip

      - name: Enable Flatpak user namespaces
        shell: bash
        run: |
          set -euo pipefail
          if ! unshare --user --map-root-user true; then
            # Ubuntu 24.04 AppArmor can block bubblewrap's unprivileged user namespaces.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            unshare --user --map-root-user true
          fi

      - name: Install GNOME Platform and SDK 50
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y --arch=x86_64 flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Fetch Flutter 3.47.2 SDK source
        run: git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"

      - name: Package inside GNOME SDK
        run: |
          python scripts/package_flatpak.py \
            --flutter-sdk "$RUNNER_TEMP/flutter" \
            --sources-dir release-sources/linux-x64 \
            --output-dir build/flatpak

      - name: Archive application source
        run: |
          git archive --format=tar.gz --prefix=ClipThat/ \
            --output=build/flatpak/ClipThat-linux-x64-app-source.tar.gz HEAD

      - name: Hash release assets
        working-directory: build/flatpak
        run: |
          sha256sum ClipThat-linux-x64.flatpak ClipThat-linux-x64-app-source.tar.gz \
            > SHA256SUMS-linux-x64

      - name: Upload Linux release artifact
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clipthat-linux-x64-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          compression-level: 0
          path: |
            build/flatpak/ClipThat-linux-x64.flatpak
            build/flatpak/ClipThat-linux-x64-app-source.tar.gz
            build/flatpak/SHA256SUMS-linux-x64

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: clipthat-release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download Linux release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: clipthat-linux-x64-${{ needs.build.outputs.tag }}
          path: release-assets

      - name: Publish Linux release assets
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ClipThat! ${{ needs.build.outputs.tag }}
          prerelease: ${{ fromJSON(needs.build.outputs.prerelease) }}
          fail_on_unmatched_files: true
          files: |
            release-assets/ClipThat-linux-x64.flatpak
            release-assets/ClipThat-linux-x64-app-source.tar.gz
            release-assets/SHA256SUMS-linux-x64
