name: Build Linux installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      - name: Reclaim unused hosted-runner SDK space
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h .

      - name: Install Flatpak build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            flatpak flatpak-builder librsvg2-common bubblewrap curl git unzip xz-utils zip

      - name: Enable Flatpak user namespaces
        shell: bash
        run: |
          set -euo pipefail
          if ! unshare --user --map-root-user true; then
            # Ubuntu AppArmor can block bubblewrap's unprivileged user namespaces.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            unshare --user --map-root-user true
          fi

      - name: Install GNOME Platform and SDK 50 with LLVM 21
        run: make flatpak-setup

      - name: Fetch stable Flutter SDK source
        run: git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"

      - name: Build Flatpak inside GNOME SDK
        run: make flatpak-installer FLUTTER_SDK="$RUNNER_TEMP/flutter"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clipthat-linux-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            build/flatpak/ClipThat-linux-x64.flatpak
            build/flatpak/SHA256SUMS-linux-x64

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: clipthat-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clipthat-linux-x64
          path: release-assets

      - name: Name release binaries with the exact tag
        shell: bash
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mv -- ClipThat-linux-x64.flatpak "ClipThat-linux-x64-${RELEASE_TAG}.flatpak"
          sha256sum -- "ClipThat-linux-x64-${RELEASE_TAG}.flatpak" > SHA256SUMS-linux-x64

      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ClipThat! ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/ClipThat-linux-x64-${{ github.ref_name }}.flatpak
            release-assets/SHA256SUMS-linux-x64
