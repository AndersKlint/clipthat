name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
          architecture: x64

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable

      - name: Build Windows portable ZIP
        shell: pwsh
        run: python scripts/package_windows.py --output-dir dist/windows-x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clipthat-windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/windows-x64/ClipThat-windows-x64.zip
            dist/windows-x64/SHA256SUMS-windows-x64
