name: Build Windows ZIP and installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
          architecture: x64

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows portable ZIP and setup EXE
        shell: pwsh
        run: python scripts/package_windows.py --output-dir dist/windows-x64

      - name: Upload Windows ZIP, setup EXE, and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clipthat-windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/windows-x64/ClipThat-windows-x64.zip
            dist/windows-x64/ClipThat-windows-x64-setup.exe
            dist/windows-x64/SHA256SUMS-windows-x64

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: clipthat-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clipthat-windows-x64
          path: release-assets

      - name: Name release binaries with the exact tag
        shell: bash
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mv -- ClipThat-windows-x64.zip "ClipThat-windows-x64-${RELEASE_TAG}.zip"
          mv -- ClipThat-windows-x64-setup.exe "ClipThat-windows-x64-setup-${RELEASE_TAG}.exe"
          sha256sum -- "ClipThat-windows-x64-${RELEASE_TAG}.zip" "ClipThat-windows-x64-setup-${RELEASE_TAG}.exe" > SHA256SUMS-windows-x64

      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ClipThat! ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/ClipThat-windows-x64-${{ github.ref_name }}.zip
            release-assets/ClipThat-windows-x64-setup-${{ github.ref_name }}.exe
            release-assets/SHA256SUMS-windows-x64
